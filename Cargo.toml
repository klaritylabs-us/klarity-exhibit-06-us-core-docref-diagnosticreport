[package]
name = "klarity-exhibit-06-us-core-docref-diagnosticreport"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "US Core DocumentReference and DiagnosticReport checks for FHIR R4"
publish = false

[lib]
name = "us_core_clinical_docs"
path = "src/lib.rs"

[[bin]]
name = "validate-clinical-doc"
path = "src/bin/validate_clinical_doc.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
